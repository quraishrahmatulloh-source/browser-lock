<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Lock</title>
  <link rel="stylesheet" href="ui.css">
  <style>html{width:380px}.page{min-height:0;padding:10px}.card{padding:22px 20px}.stack{display:grid;gap:10px}#hint{display:grid;gap:6px;justify-items:center}.hintrow{display:flex;gap:4px;align-items:center}.hintrow b{margin-left:6px;font-weight:600}</style>
</head>
<body>
<main class="page">
  <section class="card">
    <div class="hero">
      <img src="icons/icon128.png" alt="" style="width:64px;height:64px">
      <h1>Browser Lock</h1>
      <p><span class="badge" id="state">…</span></p>
    </div>
    <div class="alert hidden" id="alert"><span id="alertText"></span><button type="button" id="seen" data-i18n="p.seen">Tandai sudah dilihat</button></div>
    <p class="muted hidden" id="setupNote" data-i18n="p.setupNote"></p>
    <div class="stack">
      <button class="btn hidden" id="lockTab" type="button" data-i18n="p.lockTab">🔒 Kunci tab ini saja</button>
      <button class="btn line hidden" id="lock" type="button" data-i18n="p.lock">🔒 Kunci semua</button>
      <p class="muted hidden" id="hint" style="text-align:center"></p>
      <button class="btn line hidden" id="panic" type="button" data-i18n="p.panic">🚨 Tombol panik</button>
      <button class="btn line" id="settings" type="button" data-i18n="p.settings">⚙ Pengaturan</button>
    </div>
    <p class="foot" id="foot"></p>
  </section>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
